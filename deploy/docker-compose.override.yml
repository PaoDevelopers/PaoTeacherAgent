# PaoTeacherAgent overlay, applied after upstream docker-compose.yml + docker-compose.onyx-lite.yml.
# Paths resolve relative to deployment/docker_compose/ (the first compose file's directory).
# Run through deploy/compose.sh rather than by hand.

x-pao-env: &pao-env
  env_file:
    - path: .env
      required: false
    - path: ../../deploy/.env
      required: true

x-pao-backend-build: &pao-backend-build
  context: ../..
  dockerfile: deploy/backend.Dockerfile
  args:
    - IMAGE_TAG=${IMAGE_TAG}

services:
  api_server:
    <<: *pao-env
    build: *pao-backend-build
    volumes:
      # Knowledge folders the built-in agents sync from on every start (onyx/seeding/pao_agents.py).
      - ${PAO_KNOWLEDGE_HOST_DIR:-../../deploy/knowledge}:/app/pao_knowledge:ro
  web_server: *pao-env
  mcp_server:
    <<: *pao-env
    build: *pao-backend-build
  # Lite moves Redis to a profile, but credential_audit.py still calls Redis on every
  # LLM key read; without it each chat stalls ~60s on connection retries. Run it.
  cache:
    profiles: !reset []
  relational_db: *pao-env
  nginx: *pao-env
  # Neither agent runs code; skip the sandbox (it mounts the host Docker socket).
  code-interpreter:
    profiles: ["code-interpreter"]
