name: onyx

services:
  api_server:
    image: ghcr.io/paodevelopers/paoteacheragent-backend:latest
    build:
      context: backend
      dockerfile: ../Dockerfile
    command: /bin/sh -c "alembic upgrade head && uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    env_file: .env
    environment:
      DISABLE_VECTOR_DB: "true"
      FILE_STORE_BACKEND: postgres
      CACHE_BACKEND: postgres
      AUTH_BACKEND: postgres
      REDIS_HOST: cache
    volumes:
      - ./data/knowledge:/app/pao_knowledge:ro
    depends_on:
      relational_db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      start_period: 600s

  web_server:
    image: ghcr.io/paodevelopers/paoteacheragent-web:latest
    build: web
    env_file: .env
    environment:
      INTERNAL_URL: http://api_server:8080
      OVERRIDE_API_PRODUCTION: "true"
    ports:
      - "80:3000"
    depends_on:
      api_server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s

  relational_db:
    image: postgres:15.2-alpine
    command: -c max_connections=250
    shm_size: 1g
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  cache:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data
    restart: unless-stopped
